name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Validate plugin
        run: claude plugin validate ./plugins/squad --strict

      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Codex agents match their sources
        run: |
          node scripts/build-codex-agents.mjs
          drift="$(git status --porcelain -- plugins/squad/codex/agents)"
          if [ -n "$drift" ]; then
            echo "Los TOML de Codex no coinciden con plugins/squad/agents. Corré: node scripts/build-codex-agents.mjs"
            echo "$drift"
            exit 1
          fi

      - name: Parse Codex agents and Kimi manifest
        run: |
          python3 - <<'EOF'
          import glob, json, os, tomllib

          agents = sorted(glob.glob('plugins/squad/codex/agents/*.toml'))
          assert len(agents) == 9, f'se esperaban 9 agentes de Codex, hay {len(agents)}'
          for path in agents:
              with open(path, 'rb') as handle:
                  data = tomllib.load(handle)
              missing = {'name', 'description', 'developer_instructions'} - data.keys()
              assert not missing, f'{path}: faltan {missing}'

          with open('kimi.plugin.json', encoding='utf-8') as handle:
              kimi = json.load(handle)
          assert kimi['name'] == 'squad'
          for key in ('skills', 'agents'):
              assert kimi[key].startswith('./') and os.path.isdir(kimi[key]), f'kimi.plugin.json: {key} inválido'
          print('ok: 9 agentes de Codex y manifiesto de Kimi')
          EOF
