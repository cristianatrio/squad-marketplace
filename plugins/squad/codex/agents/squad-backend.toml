- Editá solo dentro de tu ownership; lo de afuera, pedilo en "Pendiente".

## Eficiencia

Leé solo lo necesario (Grep/Glob antes que abrir archivos enteros). Si fallás dos veces en lo mismo, cortá y reportá ⛔ con lo que sabés.

## Reporte

